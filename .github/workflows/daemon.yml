name: 24/7 Autonomous Self-Training Loop

on:
  schedule:
    # Runs automatically every 30 minutes forever
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  run-rlvr-daemon:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install groq google-genai huggingface_hub numpy scipy

      - name: Execute Autonomous RLVR Cycle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python worker.py
