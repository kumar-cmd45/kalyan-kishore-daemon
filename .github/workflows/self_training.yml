name: Hourly Self-Training & Bounty Pipeline

on:
  schedule:
    - cron: '0 * * * *'  # Runs automatically at the start of every hour (24 times/day)
  workflow_dispatch:      # Allows manual one-click trigger anytime

jobs:
  hourly-batch-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -q pyTelegramBotAPI flask requests huggingface_hub

      - name: Run 30-Trajectory High-Yield RLVR Batch
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python worker.py

      - name: Scan & Solve Paid Escrow Bounties (>= $10)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
        run: |
          python economic_agent.py
